<style>
@font-face{font-family:"IBM Plex Sans Arabic";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/ibm-plex-sans-arabic-arabic-400-normal.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+0870-088E,U+0890-0891,U+0898-08E1,U+08E3-08FF,U+200C-200E,U+2010-2011,U+204F,U+2E41,U+FB50-FDFF,U+FE70-FE74,U+FE76-FEFC}

<style>
:root{
  --paper:#f4efe6;--card:#fbf8f2;--ink:#1f1d1a;--muted:#7a736a;--line:#e0d8cb;--soft:#efe8dc;
  --z0:#b9ae9a;--z1:#c4574b;--z2:#d68f3c;--z3:#8ea84e;--z4:#2f7a57;--ringgap:#fbf8f2;
}
:root[data-theme="dark"]{
  --paper:#171614;--card:#211f1c;--ink:#efe9de;--muted:#a39a8d;--line:#35312b;--soft:#2a2723;
  --z0:#7a7366;--z1:#e06c5c;--z2:#e8a456;--z3:#a8c266;--z4:#4fb283;--ringgap:#211f1c;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;line-height:1.6;transition:background .3s}
button{font-family:inherit;color:inherit}
.app{max-width:480px;margin:0 auto;min-height:100%;position:relative;padding:0 16px 40px}
.screen{display:none;animation:fade .35s ease}
.screen.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 0 8px;gap:8px}
.top .ttl{font-weight:700;font-size:17px;flex:1;text-align:center}
.ib{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;font-size:16px;flex:none}
.sig{font-size:11px;color:var(--muted);text-align:center;margin-top:18px}
.btn{display:block;width:100%;padding:13px;border-radius:14px;border:0;background:var(--ink);color:var(--paper);font-size:16px;font-weight:500;cursor:pointer;transition:transform .15s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.sm{padding:9px;font-size:14px}
.btn:disabled{opacity:.35}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px}
.muted{color:var(--muted)}
.chip{display:inline-block;padding:2px 12px;border-radius:20px;color:#fff;font-size:13px;font-weight:500}
svg{display:block;width:100%;height:auto}
.pulse{animation:pl 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pl{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}

/* الغلاف */
#cover{min-height:100vh;display:none;flex-direction:column;justify-content:center;padding:30px 0;position:relative;overflow:hidden}
#cover.on{display:flex}
.blob{position:absolute;border-radius:50%;filter:blur(40px);opacity:.35;animation:drift 14s ease-in-out infinite alternate}
.b1{width:220px;height:220px;background:var(--z1);top:-40px;right:-60px}
.b2{width:200px;height:200px;background:var(--z3);bottom:40px;left:-70px;animation-delay:-5s}
.b3{width:160px;height:160px;background:var(--z2);bottom:-40px;right:30px;animation-delay:-9s}
@keyframes drift{to{transform:translate(30px,-25px) scale(1.15)}}
.cover-in{position:relative;text-align:center}
:root[data-theme="dark"] #cover{background:radial-gradient(120% 70% at 80% 0%,#2b2622 0%,#171614 60%)}
:root[data-theme="dark"] .blob{opacity:.16;filter:blur(55px)}
:root[data-theme="dark"] .logo .q{background:#0d0c0b;box-shadow:0 0 0 2px #efe9de33}
:root[data-theme="dark"] .ticker{border-color:#35312b}
.logo{display:inline-flex;align-items:center;gap:0;margin-bottom:14px}
.logo .q{background:#1f1d1a;color:#fff;padding:4px 14px;border-radius:8px;font-weight:700;font-size:22px;transform:rotate(-3deg);position:relative;z-index:2}
.logo .n{background:var(--z1);color:#fff;padding:8px 18px;border-radius:10px;font-weight:700;font-size:34px;transform:rotate(4deg);margin-right:-8px;letter-spacing:1px}
.cover-in h2{font-size:20px;margin:8px 0 2px}
.words{display:flex;justify-content:center;gap:8px;margin:10px 0 4px;font-size:14px}
.words span{opacity:0;animation:wordin .6s forwards}
.words span:nth-child(2){animation-delay:.5s}.words span:nth-child(3){animation-delay:1s}.words span:nth-child(4){animation-delay:1.5s}.words span:nth-child(5){animation-delay:2s}
@keyframes wordin{to{opacity:1}}
#coverArc{max-width:330px;margin:4px auto 8px}
.ticker{overflow:hidden;border-block:1px solid var(--line);margin:14px -16px;padding:7px 0;white-space:nowrap;font-size:13px;color:var(--muted)}
.ticker{position:relative;height:38px}
.ticker div{position:absolute;top:7px;white-space:nowrap;animation:tick 24s linear infinite}
@keyframes tick{from{right:100%;transform:translateX(0)}to{right:0;transform:translateX(100%)}}

/* الرئيسية */
.hello{font-size:14px;color:var(--muted)}
.hcard{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:10px 12px;margin-bottom:10px;cursor:pointer;position:relative}
.hcard .mini{width:96px;flex:none}
.hcard .info{flex:1;min-width:0}
.hcard .info b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hcard .info small{font-size:12px;color:var(--muted);display:block}
.hcard .dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-left:6px;vertical-align:middle}
.tick{width:42px;height:42px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-size:18px;cursor:pointer;flex:none;background:transparent;transition:.2s}
.tick.done{background:var(--ink);color:var(--paper)}
.tick.guard{border-color:var(--z4);color:var(--z4);font-size:15px}
.add{border:1.5px dashed var(--line);border-radius:20px;padding:14px;text-align:center;color:var(--muted);cursor:pointer;margin-top:4px}
.empty{text-align:center;padding:30px 10px}
.bigarc{margin:4px 0 12px}

/* معالج الإضافة */
.step-h{font-size:19px;font-weight:700;margin:10px 0 4px}
.opts{display:grid;gap:10px;margin:14px 0}
.opt{border:1.5px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;background:var(--card);display:flex;gap:12px;align-items:center;transition:.2s}
.opt.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.opt .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex:none}
.opt b{display:block;font-size:15px}.opt small{color:var(--muted);font-size:12.5px}
input[type=text],textarea{width:100%;padding:13px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-family:inherit;font-size:16px;outline:none}
input[type=text]:focus,textarea:focus{border-color:var(--ink)}
.ideas{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.ideas span,.tg{font-size:13px;padding:5px 11px;border-radius:16px;border:1px solid var(--line);cursor:pointer;background:var(--card)}
.tg.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.dots-nav{display:flex;gap:5px;justify-content:center;margin:6px 0}
.dots-nav i{width:22px;height:4px;border-radius:3px;background:var(--line)}
.dots-nav i.on{background:var(--ink)}
.lbl{font-size:13px;color:var(--muted);margin:16px 0 6px;display:block}
.opt-note{font-size:12px;color:var(--muted);margin-top:4px}

/* التفاصيل */
.dhead{text-align:center;margin-top:4px}
.dhead h2{font-size:21px}
.msg{background:var(--soft);border-radius:16px;padding:12px 14px;font-size:14.5px;margin:12px 0;border-right:4px solid var(--z1)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px;text-align:center}
.stats b{display:block;font-size:19px}.stats small{font-size:11.5px;color:var(--muted)}
.feelrow{display:flex;gap:4px;align-items:flex-end;height:46px;margin-top:6px}
.feelrow i{flex:1;border-radius:5px 5px 2px 2px;background:var(--z3);opacity:.85}
.feelrow i.miss{background:var(--line);height:6px!important}
.sec-t{font-size:13.5px;font-weight:700;margin:16px 0 6px}
.weeks{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.weeks i{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--z4)}
.weeks i.d{background:var(--z4)}.weeks i.h{background:var(--z1);border-color:var(--z1)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.trig{display:flex;flex-wrap:wrap;gap:6px}
.trig span{font-size:12.5px;padding:3px 10px;border-radius:14px;background:var(--soft)}
.danger{color:var(--z1);font-size:13px;text-align:center;cursor:pointer;margin-top:18px;text-decoration:underline}

/* الشيتات */
.ov{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;justify-content:center;z-index:50}
.ov.on{display:flex;animation:fade .25s}
.sheet{background:var(--card);width:100%;max-width:480px;border-radius:24px 24px 0 0;padding:20px 18px 26px;max-height:88vh;overflow:auto}
.sheet h3{font-size:18px;text-align:center;margin-bottom:4px}
.feels{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:16px 0}
.feels button{border:1.5px solid var(--line);background:var(--paper);border-radius:14px;padding:10px 2px 8px;cursor:pointer;font-size:11.5px}
.feels button svg{width:28px;margin:0 auto 4px}
.feels button.on{border-color:var(--ink);background:var(--soft)}
.help p{font-size:14px;margin-bottom:10px}
.help b{color:var(--z1)}
.conf{position:fixed;inset:0;pointer-events:none;z-index:60}

/* الستوري */
.photo-box{width:150px;height:150px;border-radius:50%;margin:12px auto;border:2px dashed var(--line);overflow:hidden;position:relative;display:grid;place-items:center;color:var(--muted);font-size:13px;touch-action:none;background:var(--soft)}
.photo-box img{position:absolute;left:50%;top:50%;transform-origin:center;user-select:none;-webkit-user-drag:none;pointer-events:none}
.formats{display:flex;gap:8px;justify-content:center;margin:10px 0}
.formats button{padding:7px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;font-size:13.5px}
.formats button.on{border-color:var(--ink);background:var(--ink);color:var(--paper)}
#storyPrev{width:100%;max-width:300px;margin:6px auto;display:block;border-radius:14px;box-shadow:0 10px 30px #0003}
input[type=range]{width:100%;accent-color:var(--z3)}

.themebtn{position:fixed;top:14px;z-index:90;left:calc(max(16px,(100vw - 480px)/2 + 16px) + 46px);color:var(--ink)}
#cover.on~* .themebtn{}
@media(min-width:900px){.themebtn{left:calc(max(16px,(100vw - 1040px)/2 + 32px) + 46px)}}
/* لابتوب وتابلت */
@media(min-width:900px){
  .app{max-width:1040px;padding:0 32px 40px}
  .homegrid{display:grid;grid-template-columns:1.15fr 1fr;gap:24px;align-items:start}
  .homegrid .bigarc{position:sticky;top:16px;margin:0}
  .dgrid{display:grid;grid-template-columns:1.1fr 1fr;gap:28px;align-items:start}
  .dgrid .dleft{position:sticky;top:16px}
  #new .wiz-wrap,#story #storyBody{max-width:480px;margin:0 auto}
  #cover .cover-in{max-width:520px;margin:0 auto}
  .ov{align-items:center}.sheet{border-radius:24px}
  .test{max-width:560px;margin-inline:auto}
}
/* وضع التجربة */
.test{margin-top:26px;border:1px dashed var(--line);border-radius:14px;padding:10px;font-size:12px;color:var(--muted)}
.test .r{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.test button{flex:1;padding:6px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:12px;min-width:80px}
.toast{position:fixed;top:64px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 18px;border-radius:20px;font-size:14px;z-index:70;display:none}
</style>
</head>
<body>
<div class="app">

</div>

<div class="ov" id="ov" onclick="if(event.target===this)closeSheet()"><div class="sheet" id="sheet"></div></div>

<script>
const LAYOUT="shared"; // cards | shared
const IG="https://www.instagram.com/eyad.hloubi";
const KEY="qa3da90_"+LAYOUT;
const HCOL=["#3f5d7a","#7a4f6d","#8a5a3c"];
const ZN=["منطقة الراحة","منطقة التوتر والخوف","منطقة التأقلم","منطقة العادة","راحتك الجديدة"];
const ZS=["الراحة","التوتر","التأقلم","العادة"];
const TH=[0,21,40,90];
const FEELS=["صعبة كتير","تقيلة","عادية","سهلة","استمتعت"];
const $=s=>document.querySelector(s);
const NS="http://www.w3.org/2000/svg";
function cssv(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
function Z(i){return cssv("--z"+i)}

/* ---------- الحالة ---------- */
let S;
function load(){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
  if(!S)S={habits:[],offset:0,seen:false,theme:"light"}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function today(){const d=new Date();d.setDate(d.getDate()+(S.offset||0));return ymd(d)}
function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function addDays(s,n){const d=new Date(s+"T12:00:00");d.setDate(d.getDate()+n);return ymd(d)}
function diff(a,b){return Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/864e5)}

/* التقدّم: قاعدة «ما في صفر» — يوم فايت ما بيأثر، يومين ورا بعض بيرجّعوا خطوة عن كل يوم زيادة */
function calc(h){
  const t=today();let done=0,pen=0,run=0,maxRun=0,streak=0;
  const n=diff(h.start,t);
  for(let i=0;i<=n;i++){const d=addDays(h.start,i);const L=h.log[d];
    if(L&&L.done){done++;run=0;streak++}
    else if(d!==t){run++;if(run>=2)pen++;streak=0}
  }
  // سلسلة متواصلة حالية
  let cur=0;for(let i=n;i>=0;i--){const d=addDays(h.start,i);if(h.log[d]&&h.log[d].done)cur++;else if(d===t)continue;else break}
  const prog=Math.max(0,Math.min(90,done-pen));
  return{done,pen,prog,missedRun:run,cur,elapsed:n+1}
}
function zoneOf(p){return p<1?0:p<21?1:p<40?2:p<90?3:4}

/* ---------- الرسم: أنصاف الدوائر ---------- */
const HC={cx:160,cy:180,R:[0,42,86,124,158]};
function el(tag,a,p,txt){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(txt!=null)e.textContent=txt;p&&p.appendChild(e);return e}
function hexA(hex,a){if(hex.startsWith("#")&&hex.length===7)return hex+Math.round(a*255).toString(16).padStart(2,"0");return hex}
function annulus(r1,r2){const{cx,cy}=HC;if(r1===0)return`M${cx-r2},${cy} A${r2},${r2} 0 0 1 ${cx+r2},${cy} Z`;
  return`M${cx-r2},${cy} A${r2},${r2} 0 0 1 ${cx+r2},${cy} L${cx+r1},${cy} A${r1},${r1} 0 0 0 ${cx-r1},${cy} Z`}
function pol(r,deg){const a=deg*Math.PI/180;return[HC.cx+r*Math.cos(a),HC.cy-r*Math.sin(a)]}
function progR(p){const R=HC.R;if(p<1)return 20;if(p>=90)return 172;for(let i=1;i<4;i++)if(p<TH[i]){const f=(p-TH[i-1])/(TH[i]-TH[i-1]);return R[i]+f*(R[i+1]-R[i])}}
/* opts: {single:{prog,color}, multi:[{prog,color,label}], labels:true, mini:false, anim:false, guard:false} */
function drawArc(svg,o){
  svg.innerHTML="";const{cx,cy,R}=HC;const z=[0,1,2,3,4].map(Z);
  const p=o.single?o.single.prog:0;const done=o.single&&p>=90;
  const gap=cssv("--ringgap");
  el("path",{d:`M${cx-172},${cy} A172,172 0 0 1 ${cx+172},${cy}`,fill:done?hexA(z[4],.14):"none",stroke:z[4],"stroke-width":done?3:1.5,"stroke-dasharray":done?"":"5 5"},svg);
  if(o.guard){el("path",{d:`M${cx-182},${cy} A182,182 0 0 1 ${cx+182},${cy}`,fill:"none",stroke:z[4],"stroke-width":3,"stroke-dasharray":"1 8","stroke-linecap":"round"},svg)}
  for(let i=0;i<4;i++)el("path",{d:annulus(R[i],R[i+1]),fill:hexA(z[i],done?.12:.15),stroke:gap,"stroke-width":2.5},svg);
  if(o.single&&!done){
    const g=el("g",{},svg);
    const paint=(pp,final)=>{g.innerHTML="";if(pp<1)return;const rp=progR(pp);
      for(let i=0;i<4;i++){const r1=R[i],r2=Math.min(R[i+1],rp);if(r2<=r1)continue;
        el("path",{d:annulus(r1,r2),fill:z[i],stroke:gap,"stroke-width":2.5},g)}
      // حافة مضيئة عند حدود التقدّم
      el("path",{d:`M${cx-rp},${cy} A${rp},${rp} 0 0 1 ${cx+rp},${cy}`,fill:"none",stroke:z[zoneOf(pp)],"stroke-width":3,opacity:.5},g);
      el("circle",{cx,cy:cy-rp,r:o.mini?13:9,fill:z[zoneOf(pp)],stroke:gap,"stroke-width":o.mini?4:3,class:final?"pulse":""},g)};
    if(o.anim){const fp=o.from!=null?o.from:0,t0=performance.now(),D=1300;
      const step=now=>{const k=Math.min(1,(now-t0)/D),e=1-Math.pow(1-k,3);paint(fp+(p-fp)*e,k>=1);if(k<1)requestAnimationFrame(step)};paint(fp,false);requestAnimationFrame(step)}
    else paint(p,true);
  }
  if(!o.mini){
    for(let i=0;i<4;i++){const rm=i===0?0:(R[i]+R[i+1])/2;el("text",{x:cx-rm,y:cy+15,"text-anchor":"middle","font-size":10.5,fill:cssv("--muted"),"font-weight":500,"font-family":"IBM Plex Sans Arabic"},svg,ZS[i])}
    ["0","21","40","90"].forEach((n,k)=>el("text",{x:cx+R[k+1],y:cy+15,"text-anchor":"middle","font-size":10,fill:cssv("--muted"),"font-family":"IBM Plex Sans Arabic"},svg,n));
  }
  if(done&&!o.mini){el("text",{x:cx,y:cy-66,"text-anchor":"middle","font-size":15,"font-weight":700,fill:z[4],"font-family":"IBM Plex Sans Arabic"},svg,o.guard?"راحتك الجديدة · الحارس":"راحتك الجديدة");
    el("text",{x:cx,y:cy-46,"text-anchor":"middle","font-size":11,fill:cssv("--muted"),"font-family":"IBM Plex Sans Arabic"},svg,"العادة صارت جزء من راحتك")}
  const dot=(x,y,col,lab)=>{el("circle",{cx:x,cy:y,r:o.mini?13:9,fill:col,stroke:gap,"stroke-width":o.mini?4:3,class:"pulse"},svg);
    if(lab)el("text",{x,y:y-15,"text-anchor":"middle","font-size":11,"font-weight":700,fill:col,"font-family":"IBM Plex Sans Arabic"},svg,lab)};
  if(o.single&&p<1)dot(cx,cy-20,z[0]);
  if(o.single&&done)dot(...pol(172,90),z[4]);
  if(o.multi){const n=o.multi.length;o.multi.forEach((m,i)=>{const ang=n===1?90:155-i*(130/(n-1));const[x,y]=pol(progR(m.prog),ang);
      // خط دليل من النقطة لبرّا الدايرة مع لصاقة واضحة
      const[lx,ly]=pol(196,ang);el("line",{x1:x,y1:y,x2:lx,y2:ly,stroke:m.color,"stroke-width":1.5,"stroke-dasharray":"3 3"},svg);
      el("circle",{cx:x,cy:y,r:11,fill:m.color,stroke:gap,"stroke-width":3,class:"pulse"},svg);
      el("text",{x,y:y+4,"text-anchor":"middle","font-size":11,"font-weight":700,fill:"#fff","font-family":"IBM Plex Sans Arabic"},svg,String(i+1));
      const tw=Math.min(110,16+m.label.length*7.2),bx=Math.max(-18,Math.min(338-tw,lx-tw/2)),by=ly-12;
      el("rect",{x:bx,y:by,width:tw,height:22,rx:11,fill:m.color},svg);
      el("text",{x:bx+tw/2,y:by+15,"text-anchor":"middle","font-size":11.5,"font-weight":700,fill:"#fff","font-family":"IBM Plex Sans Arabic"},svg,(i+1)+" · "+m.label)})}
}

function pick(a,seed){return a[Math.abs(seed)%a.length]}
function hseed(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return h}

/* ---------- الرئيسية ---------- */
function habitState(h){const c=calc(h);const t=today();const z=zoneOf(c.prog);
  const doneToday=!!(h.log[t]&&h.log[t].done);
  const guard=h.type==="neg"&&c.prog>=90;
  return{...c,z,doneToday,guard}}
function renderHome(){clearInterval(coverT);const b=$("#homeBody");
  if(!S.habits.length){b.innerHTML=`<div class="empty card"><p style="font-size:16px;font-weight:700">ما في عادات لسا</p><p class="muted" style="font-size:14px;margin:6px 0 14px">اختار عادة وحدة لتبلّش. أقصى شي 3 عادات بنفس الوقت.</p><button class="btn" onclick="go('new');wizStart()">أضف عادة</button></div>`;return}
  let html=`<p class="hello">${greet()} · ${S.habits.length} من 3 عادات</p>`;
  if(LAYOUT==="shared"){html+=`<div class="card bigarc"><svg id="sharedArc" viewBox="-24 -40 368 242"></svg><div id="sharedLeg" style="display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;font-size:12px;margin-top:6px"></div></div>`}
  if(LAYOUT==="shared")html+=`<div class="hlist">`;
  S.habits.forEach((h,i)=>{const st=habitState(h);
    const sub=st.guard?"مرحلة الحارس":st.prog>=90?"صارت راحتك":`يوم ${st.prog} من 90 · ${ZN[st.z]}`;
    const tk=st.guard?`<button class="tick guard ${guardDoneThisWeek(h)?'done':''}" onclick="event.stopPropagation();guardCheck('${h.id}')">🛡</button>`
      :`<button class="tick ${st.doneToday?'done':''}" onclick="event.stopPropagation();checkToday('${h.id}')">✓</button>`;
    html+=`<div class="hcard" onclick="openDetail('${h.id}')">
      ${LAYOUT==="cards"?`<div class="mini"><svg viewBox="-22 -4 364 206" id="mini_${h.id}"></svg></div>`:""}
      <div class="info"><b>${LAYOUT==="shared"?`<span class="dot" style="background:${h.color};width:20px;height:20px;color:#fff;font-size:11px;text-align:center;line-height:20px">${i+1}</span>`:""}${esc(h.name)}</b><small>${h.type==="neg"?"عادة بتركها":"عادة ببنيها"}</small><small>${sub}</small></div>${tk}</div>`});
  if(S.habits.length<3)html+=`<div class="add" onclick="go('new');wizStart()">+ أضف عادة</div>`;
  html+=`<button class="btn ghost sm" style="margin-top:10px" onclick="openStory('ALL',null)">شارك تقدّمك بكل العادات</button>`;
  if(LAYOUT==="shared")html=html.replace('<div class="card bigarc">','<div class="homegrid"><div class="card bigarc">')+`</div></div>`;
  b.innerHTML=html;
  if(LAYOUT==="shared"){drawArc($("#sharedArc"),{multi:S.habits.map(h=>({prog:calc(h).prog,color:h.color,label:short(h.name)}))});
    $("#sharedLeg").innerHTML="";void S.habits.map(h=>`<span><i style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${h.color};margin-left:4px"></i>${esc(short(h.name))} · ${calc(h).prog}</span>`).join("")}
  else S.habits.forEach(h=>drawArc($("#mini_"+h.id),{single:{prog:calc(h).prog},mini:true}));
  window._mc=setTimeout(dailyFlow,400);
}
/* الأيام اللي ما تعبّت: بنسأل عن كل يوم لحاله قبل أي حساب */
const BACK_MAX=14;
function pending(){const t=today();const out=[];
  S.habits.forEach(h=>{if(calcDone(h)>=90&&h.type==="neg")return;const n=diff(h.start,t);
    for(let i=Math.max(0,n-BACK_MAX);i<n;i++){const d=addDays(h.start,i);if(!h.log[d])out.push({h,d})}});
  return out.sort((a,b)=>a.d<b.d?-1:1)}
function calcDone(h){return calc(h).prog}
function dayName(d){try{return new Date(d+"T12:00:00").toLocaleDateString("ar-SY-u-nu-latn",{weekday:"long",day:"numeric",month:"long"})}catch(e){return d}}
function dailyFlow(){if(document.querySelector(".screen.on").id!=="home")return;const q=pending();if(q.length)backSheet(q);else missCheck()}
let bfPick=null;
function backSheet(q){const{h,d}=q[0];bfPick=null;const ago=diff(d,today());
  openSheet(`<p class="muted" style="text-align:center;font-size:12.5px">${q.length===1?"آخر يوم ما تعبّى":"في "+q.length+" أيام ما تعبّوا"}</p>
  <h3 style="margin-top:4px">${esc(h.name)}</h3>
  <p style="text-align:center;font-size:15px;margin:4px 0 2px"><b>${ago===1?"مبارح":dayName(d)}</b>${ago===1?" · "+dayName(d):""}</p>
  <p class="muted" style="text-align:center;font-size:14px">عملتها هاليوم؟</p>
  <div class="feels" id="bfFeels" style="display:none">${FEELS.map((f,i)=>`<button onclick="bfPick=${i};this.parentNode.querySelectorAll('button').forEach(x=>x.classList.remove('on'));this.classList.add('on');$('#bfOk').disabled=false">${feelIcon(i)}${f}</button>`).join("")}</div>
  <div id="bfAsk" class="row2" style="margin-top:14px"><button class="btn" onclick="$('#bfAsk').style.display='none';$('#bfFeels').style.display='grid';$('#bfYes').style.display='block'">إيه عملتها</button><button class="btn ghost" onclick="bfSave('${h.id}','${d}',false)">لا، ما عملتها</button></div>
  <div id="bfYes" style="display:none"><p class="muted" style="text-align:center;font-size:13.5px;margin-bottom:8px">كيف كانت عليك؟</p><button class="btn" id="bfOk" disabled onclick="bfSave('${h.id}','${d}',true)">سجّلها ✓</button></div>`)}
function bfSave(id,d,yes){const h=S.habits.find(x=>x.id===id);const before=calc(h).prog;
  h.log[d]=yes?{done:true,feel:bfPick,late:true}:{done:false};save();
  const after=calc(h).prog;const ms=[21,40,90].find(m=>before<m&&after>=m);if(ms&&!(h.ms||[]).includes(ms))h.ms=(h.ms||[]).concat(ms),save();
  closeSheet();renderHome();clearTimeout(window._mc);
  const q=pending();setTimeout(()=>{if(q.length)backSheet(q);else{toast("تعبّت كل الأيام ✓");setTimeout(missCheck,500)}},250)}
/* إجراء الانقطاع: يوم فايت = تنبيه، يومين وأكتر = رجوع خطوة بشكل واضح */
function missCheck(){const t=today();
  for(const h of S.habits){const c=calc(h);if(c.prog>=90||h.notice===t||c.missedRun<1)continue;
    h.notice=t;save();const nm=esc(h.name);
    if(c.missedRun===1){openSheet(`<div style="text-align:center"><div style="font-size:38px">⏳</div><h3>فوّتت مبارح «${nm}»</h3>
      <p class="muted" style="font-size:14px;margin:8px 0 16px">يوم واحد ما بيرجّعك لورا. بس إذا فوّتت اليوم كمان، نقطتك بترجع خطوة.</p></div>
      <button class="btn" onclick="closeSheet();checkToday('${h.id}')">بشيّك اليوم</button><button class="btn ghost" style="margin-top:8px" onclick="closeSheet()">بعدين</button>`);return}
    const back=c.missedRun-1;const was=Math.min(90,c.prog+back);const zb=zoneOf(was),za=zoneOf(c.prog);
    openSheet(`<div style="text-align:center"><div style="font-size:38px;font-weight:700;color:${Z(1)}" dir="ltr">−${back}</div><h3>رجعت ${back===1?"خطوة":back+" خطوات"} بـ«${nm}»</h3>
      <p class="muted" style="font-size:14px;margin:8px 0 6px">فوّتت ${c.missedRun===2?"يومين":c.missedRun+" أيام"} ورا بعض، فنقطتك رجعت من يوم ${was} ليوم ${c.prog}.${za<zb?` ورجعت لـ${ZN[za]}.`:""}</p>
      <p style="font-size:14px;margin-bottom:6px">بس ما رجعت للصفر. كل يوم بتشيّك فيه بيرجّعك لقدّام.</p>
      ${h.buddy?`<p class="muted" style="font-size:13px;margin-bottom:10px">وصل تنبيه لشريكك ${esc(h.buddy)}</p>`:""}</div>
      <button class="btn" onclick="closeSheet();openDetail('${h.id}',${was})">شوف وين صرت</button>`);return}}
function greet(){const h=new Date().getHours();return h<12?"صباح الخير":h<18?"يومك سعيد":"مساء الخير"}
function short(s){return s.length>12?s.slice(0,11)+"…":s}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

function checkToday(id){const h=S.habits.find(x=>x.id===id);const t=today();

  feelSheet(id)}
function undoToday(id){const h=S.habits.find(x=>x.id===id);delete h.log[today()];save();closeSheet();refresh()}
function feelIcon(i){const c=[Z(1),Z(1),Z(2),Z(3),Z(4)][i];const m=["M10 25 Q16 19 22 25","M10 24 Q16 21 22 24","M10 23 L22 23","M10 21 Q16 25 22 21","M9 20 Q16 28 23 20"][i];
  return`<svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="14" fill="none" stroke="${c}" stroke-width="2"/><circle cx="11" cy="13" r="1.8" fill="${c}"/><circle cx="21" cy="13" r="1.8" fill="${c}"/><path d="${m}" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round"/></svg>`}

function pickFeel(b,i){feelPick=i;b.parentNode.querySelectorAll("button").forEach(x=>x.classList.remove("on"));b.classList.add("on");$("#feelOk").disabled=false}
function confirmCheck(id){const h=S.habits.find(x=>x.id===id);const before=calc(h).prog;
  h.log[today()]={done:true,feel:feelPick};feelPick=null;save();closeSheet();
  const after=calc(h).prog;const ms=[21,40,90].find(m=>before<m&&after>=m);
  refresh();
  if(ms&&!(h.ms||[]).includes(ms)){h.ms=(h.ms||[]).concat(ms);save();setTimeout(()=>milestone(h,ms),350)}
  else{burst(18);toast("برافو، يوم جديد ✓")}}
function refresh(){const on=document.querySelector(".screen.on").id;if(on==="home")renderHome();if(on==="detail")renderDetail()}

/* ---------- الحارس ---------- */
function reachDate(h){const t=today();const n=diff(h.start,t);let done=0,pen=0,run=0;
  for(let i=0;i<=n;i++){const d=addDays(h.start,i);const L=h.log[d];if(L&&L.done){done++;run=0}else if(d!==t){run++;if(run>=2)pen++}
    if(done-pen>=90)return d}return t}
function guardWeek(h){return Math.floor(diff(reachDate(h),today())/7)}
function guardDoneThisWeek(h){h.gw=h.gw||{};return h.gw[guardWeek(h)]!=null}
function guardCheck(id,hard){const h=S.habits.find(x=>x.id===id);h.gw=h.gw||{};const w=guardWeek(h);
  if(hard){h.gw[w]="h";save();refresh();openSheet(`<h3>ولا يهمك</h3><p style="font-size:14.5px;margin:10px 0">${pick(NTIPS,w)}</p><p class="muted" style="font-size:13px;margin-bottom:14px">موقف صعب ما بيمحي 90 يوم. سجّلناه لتنتبه للأسبوع الجاي.</p><button class="btn" onclick="closeSheet()">تمام</button>`);return}
  if(h.gw[w]!=null){toast("شيّكت هالأسبوع ✓");return}

async function drawStory(cv){if(SG.id==="ALL")return drawStoryAll(cv);const h=S.habits.find(x=>x.id===SG.id);const st=habitState(h);const c=cv.getContext("2d");const W=1080,H=1920;

  const drawPhoto=(cx,cy,r,shape)=>{if(!photo)return;c.save();c.beginPath();if(shape==="sq")c.rect(cx-r,cy-r,2*r,2*r);else c.arc(cx,cy,r,0,Math.PI*2);c.clip();
    const B=150,s=Math.max(B/photo.width,B/photo.height),k=(2*r)/B;const w=photo.width*s*SG.zoom*k,hh=photo.height*s*SG.zoom*k;

function roundRect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function wrap(c,t,x,y,mw,lh){const ws=t.split(" ");let line="",yy=y;for(const w of ws){const test=line?line+" "+w:w;if(c.measureText(test).width>mw&&line){c.fillText(line,x,yy);line=w;yy+=lh}else line=test}c.fillText(line,x,yy)}

function burst(n){const cv=$("#conf"),c=cv.getContext("2d");cv.width=innerWidth;cv.height=innerHeight;const cols=[Z(1),Z(2),Z(3),Z(4),Z(0)];
